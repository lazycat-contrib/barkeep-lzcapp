name: BarKeep
package: cloud.lazycat.app.barkeep
version: 0.2.4
min_os_version: 1.3.8
description: A simple inventory manager for your home bar
homepage: https://github.com/nckslvrmn/bar_keep
author: nckslvrmn
application:
    subdomain: barkeep
    background_task: true
    public_path:
        - /

    upstreams:
        - location: /
          backend: http://barkeep:3000

services:
    barkeep:
        # ghcr.io/nckslvrmn/bar_keep:v0.2.4
        container_name: barkeep
        image: xget.xi-xu.me/cr/ghcr/nckslvrmn/bar_keep:v0.2.4
        environment:
            - RAILS_ENV=production
            - SECRET_KEY_BASE={{ stable_secret "secrt-key-base"  }}
            - ALLOWED_HOST={{.S.AppDomain}}
            - FORCE_SSL=false

        binds:
            - /lzcapp/var/data:/app/storage
